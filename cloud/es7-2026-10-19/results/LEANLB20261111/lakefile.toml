name = "leanlb"
version = "0.1.0"
defaultTargets = ["LeanLB"]

# Lean-checked lower-bound point sets (k = 8). Mathlib is a copy of ENCBLEAN/geo/.lake/packages
# (same revision f897ebcf, same toolchain). The repository modules that the bridge needs are copied
# verbatim into ErdosSzekeres/ (hashes in VENDOR.sha256), so every constant keeps its repository name.

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "f897ebcf72cd16f89ab4577d0c826cd14afaafc7"

[[lean_lib]]
name = "ErdosSzekeres"
globs = ["ErdosSzekeres.Basic", "ErdosSzekeres.Definitions", "ErdosSzekeres.Orientation",
  "ErdosSzekeres.OrientationGeometry", "ErdosSzekeres.Suk.BaseChart", "ErdosSzekeres.Suk.BaseOrder",
  "ErdosSzekeres.Suk.FourPoint", "ErdosSzekeres.Suk.OrientationClique", "ErdosSzekeres.Suk.SupportingLines",
  "ErdosSzekeres.Suk.TriangleOrder", "ErdosSzekeres.Suk.TriangleMembership"]

[[lean_lib]]
name = "LeanLB"
