name = "erdos_szekeres"
version = "0.1.0"
defaultTargets = ["ErdosSzekeres"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.24.0"

[[lean_lib]]
name = "ErdosSzekeres"
# Lean 4.24's compiler does not read LEAN_NUM_THREADS. Avoid overlapping
# elaboration of the large certificate terms inside an individual module.
weakLeanArgs = ["-j1"]
